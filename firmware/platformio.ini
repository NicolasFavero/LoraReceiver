; PlatformIO Project Configuration File -- PCB-LoraReceiver
;
; Recepcao LoRa (RadioLib, chip SX1276/RFM96W) com republicacao via
; MQTT, reconfiguracao em tempo real do radio (pagina web + topico
; MQTT dedicado) e persistencia da config na flash (Preferences/NVS).
;
; Tres placas suportadas com o MESMO firmware, cada uma com pinagem
; propria (ver include/Pins*.h) -- a escolha e por environment:
;
;   pio run -e pcb-autonomous-aircraft   (ESP32-S3 Super Mini, sem display)
;   pio run -e pcb-sonde                 (ESP32-S3 Super Mini, sem display)
;   pio run -e pcb-lilygo-t3             (LilyGo TTGO LoRa32 T3 v1.6.1, ESP32
;                                          "classico" + OLED SSD1306 de fabrica --
;                                          UNICA das tres com display)
;
; Depois de gravar o firmware, tambem e preciso subir o filesystem
; da pagina de config (uma vez, ou sempre que mudar algo em data/):
;
;   pio run -e <environment> --target uploadfs

[env]
platform = https://github.com/pioarduino/platform-espressif32.git
framework = arduino

lib_deps =
	jgromes/RadioLib@^7.7.1
	knolleary/PubSubClient@^2.8
	arduino-libraries/Arduino_JSON@^0.2.0
	https://github.com/ESP32Async/AsyncTCP.git
	https://github.com/ESP32Async/ESPAsyncWebServer.git

board_build.filesystem = littlefs
board_build.partitions = default.csv

; Faz o upload normal disparar o uploadfs automaticamente antes --
; ver scripts/auto_uploadfs.py pro motivo e a nota sobre desgaste
; de flash (nao e um problema real nesse volume de escrita).
extra_scripts = pre:scripts/auto_uploadfs.py

monitor_speed = 115200

; -O2: mesmas flags de antes. build_flags especificas de USB nativo
; (ARDUINO_USB_*) só fazem sentido no ESP32-S3 (USB OTG nativo) --
; ficam nos environments S3, nao aqui no [env] geral, pra nao
; quebrar o build da LilyGo (ESP32 classico, USB via CP2102/CH9102,
; sem USB OTG nativo).
; -Iinclude: o PlatformIO poe "include/" no path de inclusao
; automaticamente pro src/, mas NAO pro lib/ -- sem isso, qualquer
; header em lib/*/ que faca #include "Pins.h" ou "NetworkConfig.h"
; (ambos em include/) nao compila.
build_flags =
	-O2
	-Iinclude

[env:pcb-autonomous-aircraft]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
build_flags =
	${env.build_flags}
	-D PCB_AUTONOMOUS_AIRCRAFT
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D HW_CDC_BUF_SIZE=1024
	-D ARDUINO_USB_MSC_ON_BOOT=0
	-D ARDUINO_USB_DFU_ON_BOOT=0
	-mfix-esp32-psram-cache-issue

[env:pcb-sonde]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
build_flags =
	${env.build_flags}
	-D PCB_SONDE
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D HW_CDC_BUF_SIZE=1024
	-D ARDUINO_USB_MSC_ON_BOOT=0
	-D ARDUINO_USB_DFU_ON_BOOT=0
	-mfix-esp32-psram-cache-issue

[env:pcb-lilygo-t3]
; LilyGo TTGO LoRa32 T3 v1.6.1: ESP32 "classico" (nao S3), SX1276,
; 4MB flash, OLED SSD1306 I2C 128x64 embutido.
board = ttgo-lora32-v1
board_upload.flash_size = 4MB
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit BusIO@^1.16.1
build_flags =
	${env.build_flags}
	-D PCB_LILYGO_T3
